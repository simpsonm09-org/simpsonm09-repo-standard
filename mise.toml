# Flint runs only the tools declared in this file. Run `flint init` in a
# consuming repository to pick linters and formatters, then commit the pins
# it adds here. See https://github.com/grafana/flint/blob/main/docs/cli.md

[tools]

# Task runner
"aqua:casey/just" = "1.58.0"
"aqua:rhysd/actionlint" = "1.7.12"
"aqua:zizmorcore/zizmor" = "1.30.1"

# Linters
"aqua:grafana/flint" = "0.22.14"
biome = "2.5.14"

[env]
FLINT_CONFIG_DIR = ".github/config"

[tasks.lint]
description = "Run all lints"
run = "flint run"

[tasks."lint:fix"]
description = "Auto-fix lint issues"
run = "flint run --fix"

[tasks.test]
description = "Run the agent-access enforcement tests and the patch-coverage matcher tests"
run = "node scripts/test.mjs"
