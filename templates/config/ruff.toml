# Ruff complexity limits. Flint reads this file at $FLINT_CONFIG_DIR/ruff.toml;
# it is not a pyproject.toml [tool.ruff] table and rejects one.

[lint]
extend-select = ["C901", "PLR0912", "PLR0913", "PLR0915"]

[lint.mccabe]
max-complexity = 10

[lint.pylint]
max-args = 6
max-branches = 10
max-statements = 60
