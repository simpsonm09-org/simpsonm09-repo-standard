name: repo-maintenance-planner

# Hosted verification for the pure repository-maintenance planner only. The
# planner is a decision library with no executor, so the jobs run the pure test
# suite through the declared test-repo-maintenance operation. No credentials,
# no Git calls, and no deletions run inside the tests. See
# docs/features/repository-maintenance-planner.md.

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/repo-maintenance-planner.yml"
      - "ops.json"
      - "ops.generated.just"
      - "scripts/op.mjs"
      - "scripts/repo-maintenance-test.mjs"
      - "scripts/lib/check.mjs"
      - "scripts/lib/exit.mjs"
      - "scripts/lib/ops.mjs"
      - "scripts/lib/proc.mjs"
      - "tools/repo-maintenance/**"
  pull_request:
    paths:
      - ".github/workflows/repo-maintenance-planner.yml"
      - "ops.json"
      - "ops.generated.just"
      - "scripts/op.mjs"
      - "scripts/repo-maintenance-test.mjs"
      - "scripts/lib/check.mjs"
      - "scripts/lib/exit.mjs"
      - "scripts/lib/ops.mjs"
      - "scripts/lib/proc.mjs"
      - "tools/repo-maintenance/**"

permissions:
  contents: read

concurrency:
  group: repo-maintenance-planner-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-repo-maintenance:
    if: github.repository_owner == 'simpsonm09-org'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Run the pure planner tests
        run: node scripts/op.mjs run test-repo-maintenance
