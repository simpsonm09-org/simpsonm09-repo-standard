name: standard

on:
  workflow_call:

permissions:
  contents: read

jobs:
  standard:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Resolve the pinned standard ref
        id: pin
        env:
          WORKFLOW_REF: ${{ github.workflow_ref }}
        run: |
          ref="${WORKFLOW_REF##*@}"
          if ! printf '%s' "$ref" | grep -qE '^[0-9a-f]{40}$'; then
            ref="$(grep -ohE 'repo-standard/\.github/workflows/[a-z0-9-]+\.yml@[0-9a-f]{40}' .github/workflows/ci.yml | head -n1 | sed 's/.*@//')"
          fi
          if [ -z "$ref" ]; then
            ref="${GITHUB_SHA}"
          fi
          echo "resolved standard ref: ${ref:-<none>}"
          test -n "$ref"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
      - name: Checkout the pinned standard
        if: github.repository != 'simpsonm09-org/simpsonm09-repo-standard'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: simpsonm09-org/simpsonm09-repo-standard
          ref: ${{ steps.pin.outputs.ref }}
          path: .standard
          persist-credentials: false
      - name: Run the single-repository standard check
        run: |
          if [ "${GITHUB_REPOSITORY}" = "simpsonm09-org/simpsonm09-repo-standard" ]; then
            node scripts/check-repo.mjs . --repo "${GITHUB_REPOSITORY}"
          else
            node .standard/scripts/check-repo.mjs .
          fi
