name: aislop

on:
  workflow_call:

permissions:
  contents: read
  security-events: write

jobs:
  aislop:
    if: github.repository_owner == 'simpsonm09-org'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Scan and write SARIF
        run: npx --yes aislop@0.16.1 ci --sarif > aislop.sarif
        continue-on-error: true
      # SARIF lands in the Security tab only when code scanning is available,
      # which a free private repository does not have. Keep the upload
      # best-effort so the score gate above is the real failure signal.
      - name: Upload SARIF
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4
        with:
          sarif_file: aislop.sarif
      - name: Enforce the score gate
        run: npx --yes aislop@0.16.1 ci
