name: coverage

on:
  workflow_call:

permissions:
  contents: read

jobs:
  coverage:
    if: github.repository_owner == 'simpsonm09-org'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve the pinned standard ref
        id: pin
        env:
          WORKFLOW_REF: ${{ github.workflow_ref }}
        run: |
          ref="${WORKFLOW_REF##*@}"
          if ! printf '%s' "$ref" | grep -qE '^[0-9a-f]{40}$'; then
            ref="$(grep -ohE 'repo-standard/\.github/workflows/[a-z0-9-]+\.yml@[0-9a-f]{40}' .github/workflows/ci.yml | head -n1 | sed 's/.*@//')"
          fi
          if [ -z "$ref" ]; then
            ref="${GITHUB_SHA}"
          fi
          echo "resolved standard ref: ${ref:-<none>}"
          test -n "$ref"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
      - name: Checkout the pinned standard
        if: github.repository != 'simpsonm09-org/simpsonm09-repo-standard'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: simpsonm09-org/simpsonm09-repo-standard
          ref: ${{ steps.pin.outputs.ref }}
          path: .standard
          persist-credentials: false
      - name: Install pinned tools
        uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
      - name: Run the coverage recipe
        run: just coverage
      - name: Patch coverage gate
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ "${GITHUB_REPOSITORY}" = "simpsonm09-org/simpsonm09-repo-standard" ]; then
            node scripts/patch-coverage.mjs --lcov coverage/lcov.info --base "$BASE" --mode both --allow-missing-branch
          else
            node .standard/scripts/patch-coverage.mjs --lcov coverage/lcov.info --base "$BASE" --mode both --allow-missing-branch
          fi
      - name: Upload the coverage report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: coverage/lcov.info
          if-no-files-found: error
