name: lint

on:
  workflow_call:
    inputs:
      full:
        description: Lint every tracked file instead of only changed files.
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  flint:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install pinned tools
        uses: jdx/mise-action@9149ea85001c7435d5a66bb127d6a1b6227cb0a5 # v5.0.0
      - name: Run flint
        run: |
          if [ "${{ inputs.full }}" = "true" ]; then
            mise exec -- flint run --full
          else
            mise exec -- flint run
          fi
