name: lint

on:
  workflow_call:
    inputs:
      full:
        description: Lint every tracked file instead of only changed files.
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  flint:
    if: github.repository_owner == 'simpsonm09-org'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install pinned tools
        uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
      - name: Run flint
        run: |
          if [ "${{ inputs.full }}" = "true" ]; then
            mise exec -- flint run --full
          else
            mise exec -- flint run
          fi
      - name: Run repo-owned complexity checks
        run: |
          if just --list | grep -qE '^[[:space:]]+complexity([[:space:]]|$)'; then
            just complexity
          else
            echo "no complexity recipe, skipping"
          fi
